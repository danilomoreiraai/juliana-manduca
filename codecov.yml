coverage:
  precision: 2
  round: down
  range: 55..90
  status:
    project:
      default:
        target: auto
        threshold: 2%
    patch:
      default:
        target: 70%
        threshold: 5%

comment:
  layout: 'reach,diff,flags,files'
  behavior: default
  require_changes: true

ignore:
  - '**/*.config.*'
  - '**/src/main.tsx'
  - '**/src/server.ts'
  - '**/src/scripts/**'
